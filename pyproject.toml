[project]
name = "sound-generator"
version = "0.1.0"
description = "Algorithmic WAV synthesis, databending, and a local web UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.2",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
generate = "sound_generator.cli:main"
databend = "sound_generator.databend:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]
